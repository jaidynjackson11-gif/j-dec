<!-- ============ SIGN IN ============ -->
<div id="gate">
  <div class="logo-head">
    <img src="logo-light.png" alt="J-Dec" onerror="this.style.display='none'">
  </div>
  <div class="gate-body">
    <div class="gate-card">
      <h1>Sign in</h1>
      <p class="muted">Shop floor training &amp; tools</p>
      <label class="field">Access code
        <input type="password" id="gateInput" autocomplete="off">
      </label>
      <label class="field">Sign in as
        <select id="gateUser"></select>
      </label>
      <button id="gateBtn" class="btn primary block">Sign In</button>
      <div id="gateError" class="error-note" hidden>Incorrect access code — try again.</div>
      <p class="muted small">Demo only. Access level depends on who is signed in: management
        profiles see restricted apps; station tablets see standard apps.</p>
    </div>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app" hidden>
  <div id="view"></div>
  <nav id="bottomNav">
    <button data-nav="home"><svg class="ic"><use href="#i-home"/></svg><span>Home</span></button>
    <button data-nav="profile"><svg class="ic"><use href="#i-user"/></svg><span>Profile</span></button>
  </nav>
</div>

<div id="toast" hidden></div>

<!-- ?v= is a cache buster. Bump it together with SEED_VERSION in app.js whenever
     seed content changes, or browsers keep serving the previous build's scripts
     and the reseed never runs. -->
<script src="data.js?v=6"></script>
<script src="app.js?v=6"></script>
</body>
</html>
